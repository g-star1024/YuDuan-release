# 御端发布打包（发布仓承载 CI）
#
# 本 workflow 运行在公开仓 g-star1024/YuDuan-release（公开仓 Actions 免费），
# 从私有源码仓 g-star1024/YuDuan 拉取对应标签源码构建，产物发布到本仓库 Release。
#
# 触发：
#   - 推送 v* 标签到本仓库 → 构建私有仓同名标签源码
#   - 手动 workflow_dispatch → 可指定 source_ref（tag/分支/commit）
#
# 前置 Secret：YUDUAN_RELEASE_TOKEN —— 需具备 g-star1024/YuDuan（私有仓）
#   contents:read 权限的 PAT（classic repo 作用域或 fine-grained 单仓只读授权）。
#   Release 发布使用本仓默认 GITHUB_TOKEN，无需额外授权。
#
# 产物（发布到本仓库 Release）：
#   - macOS：主端 Tauri .dmg（未签名，首开右键打开）
#   - Windows：主端 yuduan-main.exe + 副端 yuduan-agent.exe（MSVC 原生构建，
#     遵守发布纪律：不使用 macOS 交叉编译产物）
#   - Linux：主端 yuduan-main（裸二进制，需系统预装 libwebkit2gtk-4.1 / libayatana-appindicator3 / librsvg2；.deb/AppImage 待补）
#   - 中枢：Linux amd64/arm64 / Windows / macOS 全平台部署包

name: release-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "私有仓源码 ref（tag / 分支 / commit），留空默认 main"
        required: false
        default: ""

permissions:
  contents: write

# v0.4.21（2026-11-04）：同 tag 删推重跑时旧 run 可能仍在排队/运行，
# 并发组保证同时只有一个 release run（新 run 进场自动取消排队中的旧 run）。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-hub:
    runs-on: ubuntu-latest
    env:
      # F-09：workflow_dispatch 补发时 GITHUB_REF_NAME 是分支名 main，
      # 用 source_ref（tag）优先的 RELEASE_TAG 供 PE 版本资源取版本号，避免写出 "main"。
      RELEASE_TAG: ${{ inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/go.mod  # 纯标准库零依赖，无需 go.sum/缓存

      - name: Test 中枢
        working-directory: dev
        run: go test ./... -count=1

      - name: Build 中枢（linux/windows/macos 全平台）
        working-directory: dev
        env:
          WIN_CODESIGN_PFX: ${{ secrets.WIN_CODESIGN_PFX }}
          WIN_CODESIGN_PWD: ${{ secrets.WIN_CODESIGN_PWD }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist-out

          # —— Linux（systemd）——
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/hub_linux_$arch" ./cmd/hub
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/ca_linux_$arch" ./cmd/ca
            # v0.4.26（P1 公网可达最小闭环）：ACME 自动签发客户端随中枢包分发，
            # 客户自建公网部署 -Public 流程调用 yuduan-acme issue 申请公网证书。
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/acme_linux_$arch" ./cmd/acme
            dir="hub-pkg/yuduan-hub_${TAG}_linux_${arch}"
            mkdir -p "$dir"
            cp "/tmp/hub_linux_$arch" "$dir/yuduan-hub"
            cp "/tmp/ca_linux_$arch" "$dir/yuduan-ca"
            cp "/tmp/acme_linux_$arch" "$dir/yuduan-acme"
            # v0.4.25：README 已引用 init-ca.sh，且新增客户自建公网证书脚本，
            # 两者必须随 Linux 中枢包分发（文档-产物一致性硬阻断项）。
            cp deploy/hub/env.example deploy/hub/README-deploy.md \
               deploy/hub/install.sh deploy/hub/yuduan-hub.service \
               deploy/hub/init-ca.sh deploy/hub/prepare-public-cert.sh "$dir/"
            chmod +x "$dir/install.sh" "$dir/yuduan-hub" "$dir/yuduan-ca" \
              "$dir/yuduan-acme" "$dir/init-ca.sh" "$dir/prepare-public-cert.sh"
            tar -czf "dist-out/YuDuan-hub_${TAG}_linux_${arch}.tar.gz" -C hub-pkg "yuduan-hub_${TAG}_linux_${arch}"
          done

          # —— Windows（控制台/计划任务）——
          # —— F-09：为 Windows Go 三 exe 注入 PE 版本资源（goversioninfo 编译期 .syso）——
          # hub/ca/acme.exe 在本 job 交叉编译、各出现 2 份（hub 包 + server-db 整包
          # cp -r），故在「出生地」编译期注入 .syso 天然覆盖两份副本；rcedit 仅用于
          # 本 job 不产出的 Rust agent.exe（见 build-windows）。
          VER="${RELEASE_TAG#v}"
          [ -n "$VER" ] || VER="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MA MI PA <<< "$VER"
          # VER 可能是分支名（如 main）：非纯数字段归 0，并对前导零用 10# 归一，
          # 避免 jq --argjson 收到非法 JSON 数字而崩溃。
          [[ "$MA" =~ ^[0-9]+$ ]] || MA=0
          [[ "$MI" =~ ^[0-9]+$ ]] || MI=0
          [[ "$PA" =~ ^[0-9]+$ ]] || PA=0
          MA=$((10#$MA)); MI=$((10#$MI)); PA=$((10#$PA))
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
          GV="$(go env GOPATH)/bin/goversioninfo"
          for pkg in hub ca acme; do
            # 从 dev/versioninfo.json 模板（本 step working-directory=dev）覆盖版本字段
            jq --arg v "$VER" --argjson ma "$MA" --argjson mi "$MI" --argjson pa "$PA" \
              '.FixedFileInfo.FileVersion = {"Major":$ma,"Minor":$mi,"Patch":$pa,"Build":0}
               | .FixedFileInfo.ProductVersion = {"Major":$ma,"Minor":$mi,"Patch":$pa,"Build":0}
               | .StringFileInfo.FileVersion = $v
               | .StringFileInfo.ProductVersion = $v' \
              versioninfo.json > "cmd/$pkg/versioninfo.json"
            # -64 必需：v1.4.0 不读 GOARCH 环境变量，缺 -64 会生成 i386 COFF，
            # windows/amd64 链接报 "unknown relocation type 7"（本机实跑实锤）。
            # 文件名带 _windows_amd64 后缀：Go 仅在 GOOS=windows GOARCH=amd64 链接它，
            # 后续 macOS/Linux 构建自动忽略（本机 4 目标交叉编译实锤），无需清理。
            ( cd "cmd/$pkg" && GOOS=windows GOARCH=amd64 "$GV" -64 -o "rsrc_windows_amd64.syso" versioninfo.json )
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w" -o "/tmp/hub_windows/yuduan-hub.exe" ./cmd/hub
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w" -o "/tmp/hub_windows/yuduan-ca.exe" ./cmd/ca
          # v0.4.26（P1）：ACME 客户端随 Windows 中枢包分发。
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w" -o "/tmp/hub_windows/yuduan-acme.exe" ./cmd/acme
          # F-09 CI 内自检：三 exe 均须含本版 PE 版本串（UTF-16LE），缺一即阻断，
          # 不发出无版本 exe。纯标准库、零外部依赖（无需 pefile）。
          python3 -c 'import sys; v=sys.argv[1].encode("utf-16-le"); ns=("yuduan-hub.exe","yuduan-ca.exe","yuduan-acme.exe"); base="/tmp/hub_windows/"; bad=[n for n in ns if v not in open(base+n,"rb").read()]; sys.exit("::error::缺 PE 版本资源: "+",".join(bad)) if bad else print("3 个 Windows exe 版本资源 OK:", sys.argv[1])' "$VER"

          # —— v0.4.30：门控 Authenticode 签名（Windows Go 三 exe，osslsigncode）——
          # 仅当仓库配置 WIN_CODESIGN_PFX(base64) + WIN_CODESIGN_PWD 时签名；缺则跳过、不报错
          # （保持无证书的开源构建可用）。自带 OV/EV 证书：把 .pfx base64 后存为仓库 Secret 即可。
          if [ -n "${WIN_CODESIGN_PFX:-}" ]; then
            echo "$WIN_CODESIGN_PFX" | base64 -d > /tmp/codesign.pfx
            command -v osslsigncode >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y osslsigncode; }
            for e in yuduan-hub yuduan-ca yuduan-acme; do
              osslsigncode sign -pkcs12 /tmp/codesign.pfx -pass "$WIN_CODESIGN_PWD" -h sha256 \
                -n "YuDuan" -in "/tmp/hub_windows/$e.exe" -out "/tmp/hub_windows/${e}.signed.exe"
              mv -f "/tmp/hub_windows/${e}.signed.exe" "/tmp/hub_windows/$e.exe"
            done
            rm -f /tmp/codesign.pfx
            echo "Authenticode 签名完成（Go 三 exe：hub/ca/acme）"
          else
            echo "::warning::未配置 WIN_CODESIGN_PFX，跳过 Authenticode 签名（无证书开源构建）"
          fi
          wdir="hub-pkg/yuduan-hub_${TAG}_windows_amd64"
          mkdir -p "$wdir"
          cp /tmp/hub_windows/yuduan-hub.exe "$wdir/"
          cp /tmp/hub_windows/yuduan-ca.exe "$wdir/"
          cp /tmp/hub_windows/yuduan-acme.exe "$wdir/"
          # v0.4.25：Windows 侧客户自建公网证书脚本（PowerShell 版）随包分发；
          # 下方 server-db 整包由本目录 cp -r 复制，自动继承该文件，无需再加一步。
          cp deploy/hub/env.example deploy/hub/README-deploy.md \
             deploy/hub/deploy.bat deploy/hub/run-hub.cmd deploy/hub/register-task.ps1 \
             deploy/hub/cleanup.ps1 deploy/hub/prepare-public-cert.ps1 "$wdir/"
          (cd hub-pkg && zip -rq "../dist-out/YuDuan-hub_${TAG}_windows_amd64.zip" "yuduan-hub_${TAG}_windows_amd64")

          # —— v0.4.24：服务器整包（hub + PostgreSQL 数据库附件）——
          # 用户要求：出一个「带数据库附件的服务器版本」，离线/内网服务器解压即部署，
          # register-task.ps1 自动检测包内 pgsql-windows-x64-binaries.zip，免公网下载。
          # PG 用 EDB 官方便携包 16.9-1 固定版（与脚本 $PG_VERSION_PIN 一致，约 314MB）。
      - name: Pack 服务器整包（hub + PostgreSQL 捆绑）
        working-directory: dev
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -L --retry 3 --retry-delay 3 --connect-timeout 20 \
            -o /tmp/pgsql-windows-x64-binaries.zip \
            "https://get.enterprisedb.com/postgresql/postgresql-16.9-1-windows-x64-binaries.zip"
          # 完整性粗检：zip 魔数 + 体积下限（<300MB 视为截断，防半截包进 Release）
          [ "$(head -c2 /tmp/pgsql-windows-x64-binaries.zip)" = "PK" ] || { echo "::error::PG 包魔数异常"; exit 1; }
          sz=$(stat -c%s /tmp/pgsql-windows-x64-binaries.zip); echo "PG zip size=$sz"
          [ "$sz" -gt 300000000 ] || { echo "::error::PG 包疑似截断（$sz bytes）"; exit 1; }
          sdir="hub-pkg/yuduan-hub-server-db_${TAG}_windows_amd64"
          cp -r "hub-pkg/yuduan-hub_${TAG}_windows_amd64" "$sdir"
          cp /tmp/pgsql-windows-x64-binaries.zip "$sdir/"
          (cd hub-pkg && zip -rq "../dist-out/YuDuan-hub-server-db_${TAG}_windows_amd64.zip" "yuduan-hub-server-db_${TAG}_windows_amd64")
          ls -la dist-out/

          # —— macOS（launchd）——
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/hub_darwin_$arch" ./cmd/hub
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/ca_darwin_$arch" ./cmd/ca
            # v0.4.26（P1）：ACME 客户端随 macOS 中枢包分发。
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/acme_darwin_$arch" ./cmd/acme
            dir="hub-pkg/yuduan-hub_${TAG}_macos_${arch}"
            mkdir -p "$dir"
            cp "/tmp/hub_darwin_$arch" "$dir/yuduan-hub"
            cp "/tmp/ca_darwin_$arch" "$dir/yuduan-ca"
            cp "/tmp/acme_darwin_$arch" "$dir/yuduan-acme"
            # v0.4.25（拍板）：macOS 中枢包带 init-ca.sh + prepare-public-cert.sh，
            # README 已引用 init-ca.sh，不能缺件。
            cp deploy/hub/env.example deploy/hub/README-deploy.md deploy/hub/install-macos.sh \
               deploy/hub/init-ca.sh deploy/hub/prepare-public-cert.sh "$dir/"
            chmod +x "$dir/install-macos.sh" "$dir/yuduan-hub" "$dir/yuduan-ca" \
              "$dir/yuduan-acme" "$dir/init-ca.sh" "$dir/prepare-public-cert.sh"
            tar -czf "dist-out/YuDuan-hub_${TAG}_macos_${arch}.tar.gz" -C hub-pkg "yuduan-hub_${TAG}_macos_${arch}"
          done
          ls -la dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: hub-all
          path: dev/dist-out/*
          if-no-files-found: error

  build-macos:
    # v0.4.21 发版实测（2026-11-04 晚）：macos-latest 池连续两次
    # "The job was not acquired by Runner of type hosted even after multiple attempts"
    # + GitHub Internal server error（排队 15min 被收 / 运行 15min 被收，0 失败步骤，
    # 其余平台全绿）——hosted macOS 池调度故障。pin 到 macos-15 固定镜像池规避；
    # timeout-minutes 兜底防止构建悬挂无限占用；concurrency 防多 run 叠加互踩。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin  # macos-latest 为 arm64 runner，Intel 版交叉构建

      - name: Build 主端（macOS dmg，双架构）
        working-directory: main
        run: |
          npm ci
          npx tauri build
          npx tauri build --target x86_64-apple-darwin

      # v0.4.10（实测报告问题 1）：agent 版本串改为构建期注入（YUDUAN_AGENT_VERSION
      # = 发布号去 v），杜绝「发版忘 bump 常量」回归（v0.4.8 实锤自报 0.4.7）。
      - name: Build 副端 agent（macOS 双架构）
        working-directory: rust/agent
        run: |
          mkdir -p dist-out
          VER="${GITHUB_REF_NAME#v}"
          YUDUAN_AGENT_VERSION="$VER" rustc -O src/main.rs -o dist-out/yuduan-agent-arm64
          YUDUAN_AGENT_VERSION="$VER" rustc -O --target x86_64-apple-darwin src/main.rs -o dist-out/yuduan-agent-x64
          # ad-hoc 自签名（arm64 链接器默认已签，显式统一）
          codesign --force --sign - dist-out/yuduan-agent-arm64 dist-out/yuduan-agent-x64
          # v0.4.10：构建即自检——运行 --version 必须等于发布号（option_env! 注入的
          # 短串会被编译器内联为指令立即数，对二进制 grep 不可靠，运行时输出才可信）
          GOT="$(./dist-out/yuduan-agent-arm64 --version)"
          echo "arm64 $GOT"
          [ "$GOT" = "yuduan-agent $VER" ] || { echo "::error::版本自检失败: got '$GOT' want 'yuduan-agent $VER'"; exit 1; }
          ls -la dist-out/

      # v0.4.10：macOS 主端 ad-hoc 自签名——未签名 app 在较新 macOS（Sequoia+）会报
      # 「已损坏，无法打开」，ad-hoc 签名可消除该误报；仍非 Developer ID 分发级签名
      # （首开右键打开依旧）。
      # v0.4.43：门控 Developer ID 签名 + notarytool 公证 + staple——配置以下 Secrets 后
      # 自动启用，产出免右键双开的分发级 dmg；未配置则回退 ad-hoc（行为与旧版一致）：
      #   APPLE_CERTIFICATE           Developer ID Application .p12 的 base64
      #   APPLE_CERTIFICATE_PASSWORD  p12 导出密码
      #   APPLE_ID / APPLE_PASSWORD(App 专用密码) / APPLE_TEAM_ID
      - name: codesign 主端（Developer ID 门控，无凭据回退 ad-hoc）
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APPS="main/src-tauri/target/release/bundle/macos/*.app main/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app"
          DMGS="main/src-tauri/target/release/bundle/dmg/*.dmg main/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            set -e
            KC=yuduan-build.keychain-db
            KPWD=yuduan-ci-keychain
            echo "$APPLE_CERTIFICATE" | python3 -c "import sys,base64;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > /tmp/yd-devid.p12
            security create-keychain -p "$KPWD" "$KC" || true
            security unlock-keychain -p "$KPWD" "$KC"
            security import /tmp/yd-devid.p12 -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPWD" "$KC"
            security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)".*/\1/')
            [ -n "$IDENTITY" ] || { echo "::error::keychain 中未找到 Developer ID Application 证书"; exit 1; }
            echo "IDENTITY=$IDENTITY"
            for app in $APPS; do codesign --force --deep --sign "$IDENTITY" --options runtime "$app"; done
            for dmg in $DMGS; do codesign --force --sign "$IDENTITY" "$dmg"; done
            xcrun notarytool store-credentials yuduan-notary --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
            for dmg in $DMGS; do
              xcrun notarytool submit "$dmg" --keychain-profile yuduan-notary --wait
              xcrun stapler staple "$dmg"
            done
            security delete-keychain "$KC" || true
            rm -f /tmp/yd-devid.p12
            echo "Developer ID 签名 + 公证 + staple 完成（免右键）"
          else
            echo "::warning::未配置 APPLE_CERTIFICATE 等 Secrets，回退 ad-hoc 签名（首开仍需右键）"
            for app in $APPS; do codesign --force --deep --sign - "$app"; done
            for dmg in $DMGS; do codesign --force --sign - "$dmg"; done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist-out
          cp main/src-tauri/target/release/bundle/dmg/*.dmg dist-out/
          cp main/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist-out/
          cp rust/agent/dist-out/yuduan-agent-arm64 rust/agent/dist-out/yuduan-agent-x64 dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-client
          path: dist-out/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      # F-09：同 build-hub，补发场景用 RELEASE_TAG 取版本号，避免写出 "main"。
      RELEASE_TAG: ${{ inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build 副端 agent（MSVC 原生；exe 自安装：双击即清旧配置+装服务+启动）
        working-directory: rust/agent
        shell: pwsh
        run: |
          $env:YUDUAN_AGENT_VERSION = ($env:GITHUB_REF_NAME -replace '^v','')
          rustc -O src/main.rs -o yuduan-agent.exe
          $got = (& .\yuduan-agent.exe --version) -join ''
          Write-Output "agent $got"
          if ($got -ne "yuduan-agent $env:YUDUAN_AGENT_VERSION") {
            Write-Output "::error::版本自检失败: got '$got' want 'yuduan-agent $env:YUDUAN_AGENT_VERSION'"
            exit 1
          }

      - name: Build 主端（Windows exe 裸二进制 + NSIS 安装器）
        working-directory: main
        shell: pwsh
        run: |
          npm ci 2>&1 | tee build-main.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # v0.4.43（N4 后续）：--no-bundle → --bundles nsis。裸 exe 仍在
          # target/release/yuduan-main.exe（bundling 只追加安装器、不移除裸二进制），
          # 另产出 bundle/nsis/*-setup.exe 供企业批量静默分发（NSIS 标准 /S 参数）。
          npx tauri build --bundles nsis 2>&1 | tee -a build-main.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "==================== error 行（最多 8 条）===================="
            Select-String -Path build-main.log -Pattern "error(\[|:)" | Select-Object -Last 8 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            Write-Output "==================== 日志尾部 3 行 ===================="
            Get-Content build-main.log -Tail 3 | ForEach-Object { Write-Output "::error::$($_.Trim())" }
            exit 1
          }

      # F-09：为 Rust agent.exe 注入 PE 版本资源。该 exe 由 rustc -O 直出、无
      # tauri-winres，故用 rcedit 在构建后写 VERSIONINFO；yuduan-main.exe 已由
      # tauri-winres 带版本资源，不在此处理。Go 三 exe 由 build-hub 用 .syso 注入。
      # 落点在 Build 主端之后：failure() 日志分支假定 main/build-main.log 已存在，
      # 若本 step 在主端构建之前失败会连带触发该分支却缺主端日志、掩盖真实根因。
      - name: 注入 PE 版本资源到 agent.exe（F-09 rcedit）
        working-directory: rust/agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VER = ($env:RELEASE_TAG -replace '^v','')
          if ([string]::IsNullOrEmpty($VER)) { $VER = ($env:GITHUB_REF_NAME -replace '^v','') }
          Write-Output "目标版本 VER=$VER"
          $rc = "$env:RUNNER_TEMP\rcedit-x64.exe"
          curl.exe -L --retry 3 --connect-timeout 20 -o $rc `
            "https://github.com/electron/rcedit/releases/download/v1.1.1/rcedit-x64.exe"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::rcedit 下载失败"; exit 1 }
          # 硬校验 rcedit-x64.exe v1.1.1 官方发布件 sha256（本机 shasum 实锤）
          $expected = '02E8E8C5D430D8B768980F517B62D7792D690982B9BA0F7E04163CBC1A6E7915'
          $actual = (Get-FileHash $rc -Algorithm SHA256).Hash
          Write-Output "rcedit sha256=$actual"
          if ($actual -ne $expected) {
            Write-Output "::error::rcedit sha256 校验失败: got $actual want $expected"
            exit 1
          }
          # 版本字符串/描述一律 ASCII，规避 Windows runner 上 native exe 参数编码问题。
          # 显式 set-version-string 把 StringFileInfo 字面钉死为 3 段的 $VER：
          # rcedit --set-file-version 对 3 段串可能补第 4 段 ".0"，若读回成 4 段
          # 会与下方 $VER 严格自检不符而误判阻断发布。
          & $rc "yuduan-agent.exe" --set-file-version "$VER" --set-product-version "$VER" `
            --set-version-string "ProductName" "YuDuan" `
            --set-version-string "FileDescription" "YuDuan Rust Agent" `
            --set-version-string "CompanyName" "YuDuan" `
            --set-version-string "FileVersion" "$VER" `
            --set-version-string "ProductVersion" "$VER"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::rcedit 写入版本资源失败"; exit 1 }
          # CI 内自带验收：读回 PE 版本资源，任一不符即阻断，不发出无版本 exe
          $vi = (Get-Item "yuduan-agent.exe").VersionInfo
          Write-Output "agent.exe FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion)"
          if ($vi.FileVersion -ne $VER -or $vi.ProductVersion -ne $VER) {
            Write-Output "::error::agent.exe 版本资源自检失败: FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion) want $VER"
            exit 1
          }

      # v0.4.44：V3 CI 级断言（第 24 轮报告明确要求）——v0.4.40/41 两轮「优雅停止」修复
      # 文档宣称已收口、实机均无效，真根因是 SERVICE_ACCEPT_STOP 常量写错（0x2，应为 0x1），
      # SCM 拒收 STOP 报 1052。文档无法自证，改为 CI 级断言：Windows runner 上把刚构建的
      # yuduan-agent.exe 以服务方式拉起，sc stop 必须 5s 内转 STOPPED；否则构建失败，
      # 杜绝「修复未经验证就宣称」。
      - name: V3 断言（服务 STOP 可接受：sc stop 5s 内 STOPPED）
        working-directory: rust/agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $name = 'yuduan-agent-ci'
          $exe = (Resolve-Path ".\yuduan-agent.exe").Path
          sc.exe create $name binPath= "`"$exe`"" start= demand | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::sc create 失败 exit=$LASTEXITCODE"; exit 1 }
          $t0 = Get-Date
          sc.exe start $name | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::sc start 失败 exit=$LASTEXITCODE"
            sc.exe delete $name | Out-Null
            exit 1
          }
          Start-Sleep -Seconds 3
          sc.exe stop $name | Out-Null
          $stopOk = ($LASTEXITCODE -eq 0)
          $stopped = $false
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Milliseconds 500
            if (sc.exe query $name | Select-String 'STOPPED') { $stopped = $true; break }
          }
          $elapsed = [math]::Round(((Get-Date) - $t0).TotalSeconds, 1)
          Write-Output "V3 CI 断言: stopOk=$stopOk stopped=$stopped elapsed=${elapsed}s"
          sc.exe delete $name | Out-Null
          if (-not $stopOk)  { Write-Output "::error::sc stop 被拒（1052 类）——dwControlsAccepted 未含 SERVICE_ACCEPT_STOP"; exit 1 }
          if (-not $stopped) { Write-Output "::error::服务 5s 内未转 STOPPED（HandlerEx 不可达或停止路径阻塞）"; exit 1 }

      # v0.4.30：门控 Authenticode 签名（Rust agent.exe + Tauri main.exe，signtool）。
      # 仅当仓库配置 WIN_CODESIGN_PFX(base64) + WIN_CODESIGN_PWD 时签名；缺则跳过、不报错。
      # RFC3161 时间戳（DigiCert）保证签名长期有效；无证书的开源构建自动跳过。
      - name: Authenticode sign（agent + main，signtool）
        working-directory: rust/agent
        shell: pwsh
        env:
          WIN_CODESIGN_PFX: ${{ secrets.WIN_CODESIGN_PFX }}
          WIN_CODESIGN_PWD: ${{ secrets.WIN_CODESIGN_PWD }}
        run: |
          # 门控：仅当仓库配置 WIN_CODESIGN_PFX(base64) 时签名；缺则跳过、不报错。
          # 注意：GitHub Actions 不允许在 if: 条件里引用 secrets 上下文，
          # 故改在脚本体内判定（与上方 osslsigncode 块一致）。
          if ([string]::IsNullOrEmpty($env:WIN_CODESIGN_PFX)) {
            Write-Output "::warning::未配置 WIN_CODESIGN_PFX，跳过 Authenticode 签名（无证书开源构建）"
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP "yd-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CODESIGN_PFX))
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $st) { Write-Output "::error::未找到 signtool.exe（Windows SDK 缺失）"; exit 1 }
          foreach ($rel in @("yuduan-agent.exe", "../main/src-tauri/target/release/yuduan-main.exe")) {
            $exe = Resolve-Path $rel -ErrorAction SilentlyContinue
            if (-not $exe) { Write-Output "::error::签名目标缺失: $rel"; exit 1 }
            & $st sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WIN_CODESIGN_PWD $exe
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::signtool 签名失败: $exe"; exit 1 }
          }
          # v0.4.43：NSIS 安装器一并签名（仍在本门控段内；无证书时整段已跳过）
          $setup = Get-ChildItem "../main/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            & $st sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WIN_CODESIGN_PWD $setup.FullName
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::signtool 签名失败: $($setup.FullName)"; exit 1 }
          }
          Remove-Item $pfx -Force
          Write-Output "Authenticode 签名完成（agent + main）"

      - name: 失败时推日志到 ci-logs-win 分支
        if: failure()
        working-directory: main
        shell: pwsh
        run: |
          git config user.email "ci@yuduan.local"
          git config user.name "ci-logger"
          git checkout --orphan ci-logs-win
          git rm -rf --cached . 2>$null
          git add build-main.log
          git commit -m "windows main build log"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::commit failed"; exit 1 }
          git push -f "https://x-access-token:${env:YUDUAN_RELEASE_TOKEN}@github.com/g-star1024/YuDuan-release.git" ci-logs-win
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::push ci-logs-win failed"; exit 1 }
        env:
          YUDUAN_RELEASE_TOKEN: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            rust/agent/yuduan-agent.exe
            main/src-tauri/target/release/yuduan-main.exe
            main/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build deps（X11/Xtst 原生库）
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev

      - name: Build 副端 agent（Linux amd64，std-only 单文件）
        working-directory: rust/agent
        run: |
          mkdir -p dist-out
          YUDUAN_AGENT_VERSION="${GITHUB_REF_NAME#v}" rustc -O src/main.rs -o dist-out/yuduan-agent-linux-amd64
          GOT="$(./dist-out/yuduan-agent-linux-amd64 --version)"
          echo "linux $GOT"
          [ "$GOT" = "yuduan-agent ${GITHUB_REF_NAME#v}" ] || { echo "::error::版本自检失败: got '$GOT'"; exit 1; }
          ls -la dist-out/

      - name: 打包 Linux 副端部署包（systemd + install.sh）
        working-directory: rust/agent
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist-out/pkg
          dir="dist-out/pkg/yuduan-agent_${TAG}_linux_amd64"
          mkdir -p "$dir/systemd"
          cp "dist-out/yuduan-agent-linux-amd64" "$dir/yuduan-agent"
          cp deploy/install-linux.sh "$dir/install.sh"
          cp deploy/systemd/yuduan-agent.service "$dir/systemd/yuduan-agent.service"
          cp README.md "$dir/README.md"
          chmod +x "$dir/install.sh" "$dir/yuduan-agent"
          tar -czf "dist-out/YuDuan-agent_${TAG}_linux_amd64.tar.gz" -C "dist-out/pkg" "yuduan-agent_${TAG}_linux_amd64"
          ls -la dist-out/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: rust/agent/dist-out/*.tar.gz
          if-no-files-found: error

  # v0.4.25：补齐 Linux arm64 副端产物（客户自建公网部署 + ARM 服务器诉求）。
  # 采用原生 ARM runner（ubuntu-24.04-arm）+ 裸 rustc -O：runner 本身即 aarch64，
  # 不指定 --target、不装交叉工具链、不加 targets:，规避交叉链接 X11/Xtst 时
  # sysroot 与 -L 路径偏移（v0.4.21 多架构镜像版本偏移即此类问题）。
  # 【降级设计】独立 job，publish 仅「追加上传」、不列入 success 断言：
  # runner label 不可用 / 构建失败时，13 个既有产物照发，仅 ::warning:: 降级，
  # 不拖垮关键路径（与 build-macos 池故障容错同一思路）。
  build-agent-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps（X11/Xtst 原生库，arm64 原生包）
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev

      - name: Build 副端 agent（Linux arm64 原生，std-only 单文件）
        working-directory: rust/agent
        run: |
          mkdir -p dist-out
          VER="${GITHUB_REF_NAME#v}"
          YUDUAN_AGENT_VERSION="$VER" rustc -O src/main.rs -o dist-out/yuduan-agent-linux-arm64
          GOT="$(./dist-out/yuduan-agent-linux-arm64 --version)"
          echo "linux-arm64 $GOT"
          [ "$GOT" = "yuduan-agent $VER" ] || { echo "::error::版本自检失败: got '$GOT' want 'yuduan-agent $VER'"; exit 1; }
          ls -la dist-out/

      - name: 验收 arm64 ELF（魔数 / file / 可执行位）
        working-directory: rust/agent
        run: |
          bin=dist-out/yuduan-agent-linux-arm64
          magic="$(od -An -tx1 -N4 "$bin" | tr -d ' \n')"
          echo "ELF magic=$magic"
          [ "$magic" = "7f454c46" ] || { echo "::error::非 ELF 文件（magic=$magic）"; exit 1; }
          # 用命令替换而非管道：GitHub bash 默认 -o pipefail，grep -q 提前退出
          # 可能让 file 收 SIGPIPE 造成误判。
          desc="$(file -b "$bin")"
          echo "file: $desc"
          [[ "$desc" == *aarch64* ]] || { echo "::error::file 未识别为 ARM aarch64（疑似产出 amd64 二进制）：$desc"; exit 1; }
          [ -x "$bin" ] || { echo "::error::缺少可执行位"; exit 1; }
          echo "arm64 ELF / aarch64 / 可执行位 / --version 四项验收通过"

      - name: 打包 Linux arm64 副端部署包（systemd + install.sh）
        working-directory: rust/agent
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist-out/pkg
          dir="dist-out/pkg/yuduan-agent_${TAG}_linux_arm64"
          mkdir -p "$dir/systemd"
          cp "dist-out/yuduan-agent-linux-arm64" "$dir/yuduan-agent"
          cp deploy/install-linux.sh "$dir/install.sh"
          cp deploy/systemd/yuduan-agent.service "$dir/systemd/yuduan-agent.service"
          cp README.md "$dir/README.md"
          chmod +x "$dir/install.sh" "$dir/yuduan-agent"
          tar -czf "dist-out/YuDuan-agent_${TAG}_linux_arm64.tar.gz" -C "dist-out/pkg" "yuduan-agent_${TAG}_linux_arm64"
          ls -la dist-out/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent-arm64
          path: rust/agent/dist-out/*.tar.gz
          if-no-files-found: error

  build-linux-main:
    # E 类（v0.4.26 补出）：Linux 主端裸二进制（Tauri --no-bundle），与 macOS/Windows 主端并列。
    # 进 needs 但不进 success 硬断言——构建失败仅 ::warning:: 降级，不阻塞其余 14 产物发布。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps（Tauri webkit2gtk + appindicator + librsvg）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Build 主端（Linux amd64 裸二进制，--no-bundle）
        working-directory: main
        run: |
          npm ci 2>&1 | tee build-main-linux.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi
          npx tauri build --no-bundle 2>&1 | tee -a build-main-linux.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "==================== error 行（最多 8 条）===================="
            grep -E "error(\[|:)" build-main-linux.log | tail -8 | sed 's/^/::error::/'
            echo "==================== 日志尾部 3 行 ===================="
            tail -3 build-main-linux.log | sed 's/^/::error::/'
            exit 1
          fi
          BIN="src-tauri/target/release/yuduan-main"
          [ -x "$BIN" ] || { echo "::error::Linux 主端二进制缺失或不可执行"; exit 1; }
          echo "Linux 主端构建 OK: $(./$BIN --version 2>/dev/null || echo 'version 未知')"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-main
          path: main/src-tauri/target/release/yuduan-main
          if-no-files-found: error

  publish:
    # v0.4.36 修正（2026-11-10）：GitHub Actions 在「needs 中任一 job 被 cancelled」
    # 时会**无条件跳过**下游 job，且 if: 中的 needs.X.result=='cancelled' 无法救回
    # （实测两次发版 build-macos 池故障 cancelled → publish 被 skipped → 零 Release）。
    # 故 macOS 与 Linux-arm64 这两个「尽力而为」产物**必须移出 needs**，
    # 仅由 publish 内的 artifact 目录守卫 + ::warning:: 降级处理缺席；
    # 关键路径（必须成功）仅剩 build-windows/build-hub/build-linux-agent/build-linux-main。
    # 历史（保留）：v0.4.21 发版夜 macOS hosted 池整体故障，连续 5 发 build-macos
    # 排队 ~15-17min 后被收（cancelled，0 失败步骤，其余平台全绿）——当时即拆关键路径。
    # macOS 池恢复后：gh release upload --clobber 追加 mac 产物，或
    # workflow_dispatch(source_ref=同 tag) 重跑（publish 对已存在 Release 追加资产）。
    needs: [build-windows, build-hub, build-linux-agent, build-linux-main]
    if: >-
      always() &&
      needs.build-windows.result == 'success' &&
      needs.build-hub.result == 'success' &&
      needs.build-linux-agent.result == 'success' &&
      needs.build-linux-main.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # v0.4.36 修正：build-macos 已移出 needs（避免其 cancelled 时 publish 被整job跳过）。
      # 但为兼顾「macOS 健康但构建慢」场景（避免漏打 mac 产物），此处轮询当前 run 的
      # build-macos job 终态：success → 下方 download 能取到 mac artifact（15/15）；
      # cancelled/failure/skipped → 跳过 mac（已有 ::warning:: 降级，13 个非 mac 产物照发）。
      # 轮询有上限，超时按「缺席」降级，绝不死等。
      - name: 等待 build-macos 终态（不阻塞于 cancelled）
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 90); do
            st=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              | python3 -c "import sys,json; d=json.load(sys.stdin,strict=False); js=d.get('jobs',[]); print(next((j.get('conclusion') or j.get('status') for j in js if j.get('name')=='build-macos'),'none'))")
            echo "build-macos state=$st (try $i)"
            case "$st" in
              success|failure|cancelled|skipped) break;;
              *) sleep 20;;
            esac
          done
      - uses: actions/download-artifact@v4
        with:
          path: dist-out

      - name: 按标签重命名产物
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ inputs.source_ref || 'snapshot' }}"; fi
          mkdir -p release-files
          dmg_arm=$(find dist-out -name "*aarch64*.dmg" | head -1)
          dmg_x64=$(find dist-out -name "*x64*.dmg" | head -1)
          mainexe=$(find dist-out/windows-client -name "yuduan-main.exe" | head -1)
          agentexe=$(find dist-out/windows-client -name "yuduan-agent.exe" | head -1)
          setupexe=$(find dist-out/windows-client -name "*-setup.exe" | head -1)
          echo "dmg_arm=$dmg_arm"; echo "dmg_x64=$dmg_x64"; echo "main=$mainexe"; echo "agent=$agentexe"; echo "setup=$setupexe"
          # macOS 产物条件复制：池故障期间 build-macos 不产出，缺文件跳过不挂发布
          if [ -n "$dmg_arm" ]; then cp "$dmg_arm" "release-files/YuDuan-main_${TAG}_macos_arm64.dmg"; else echo "::warning::mac dmg arm 缺席（macOS 池故障），本次 Release 不含该产物"; fi
          if [ -n "$dmg_x64" ]; then cp "$dmg_x64" "release-files/YuDuan-main_${TAG}_macos_x64.dmg"; else echo "::warning::mac dmg x64 缺席"; fi
          cp "$mainexe" "release-files/YuDuan-main_${TAG}_windows.exe"
          # E 类：Linux 主端裸二进制（条件复制，缺件仅 warning 降级）
          mainlinux=$(find dist-out/linux-main -name "yuduan-main" | head -1)
          if [ -n "$mainlinux" ]; then cp "$mainlinux" "release-files/YuDuan-main_${TAG}_linux_amd64"; else echo "::warning::Linux 主端二进制缺席（构建失败/跳过），本次 Release 不含该产物"; fi
          cp "$agentexe" "release-files/YuDuan-agent_${TAG}_windows.exe"
          # v0.4.43：NSIS 安装器（企业批量静默分发；缺席仅 warning 降级为 15 资产）
          if [ -n "$setupexe" ]; then cp "$setupexe" "release-files/YuDuan-main_${TAG}_windows_setup.exe"; else echo "::warning::NSIS setup 缺席（构建/上传异常），本次 Release 不含该产物"; fi
          if [ -d dist-out/macos-client ]; then
            cp dist-out/macos-client/yuduan-agent-arm64 "release-files/YuDuan-agent_${TAG}_macos_arm64" || echo "::warning::mac agent arm64 缺席"
            cp dist-out/macos-client/yuduan-agent-x64 "release-files/YuDuan-agent_${TAG}_macos_x64" || echo "::warning::mac agent x64 缺席"
          else
            echo "::warning::macos-client artifact 缺席（macOS 池故障），本次 Release 不含 mac 产物"
          fi
          cp dist-out/linux-agent/*.tar.gz "release-files/"
          # v0.4.25：arm64 独立 job 的追加上传——产物目录存在才复制；
          # 缺席（runner 不可用/构建失败）仅 warning，13 个既有产物照常发布。
          if [ -d dist-out/linux-agent-arm64 ]; then
            cp dist-out/linux-agent-arm64/*.tar.gz "release-files/" || echo "::warning::Linux arm64 副端 tar.gz 复制失败，本次 Release 不含该产物"
          else
            echo "::warning::Linux arm64 副端产物缺席（原生 ARM runner 故障/未就绪），13 个既有产物照发"
          fi
          cp dist-out/hub-all/*.tar.gz dist-out/hub-all/*.zip release-files/
          ls -la release-files/
          # 版本串校验在各构建 job 内以「运行 --version」完成（v0.4.10）——二进制 grep
          # 对 option_env! 注入的短串不可靠（编译器内联为指令立即数）。

      - name: 发布 Release 到本仓库
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: g-star1024/YuDuan-release  # publish 无 checkout，必须显式指定仓库
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ inputs.source_ref || 'snapshot' }}"; fi
          if ! gh release create "$TAG" release-files/* \
            --title "御端 $TAG" \
            --notes "御端发布 $TAG

          ## 客户端
          - macOS 主端：YuDuan-main_${TAG}_macos_arm64.dmg（Apple Silicon）/ _macos_x64.dmg（Intel）——ad-hoc 自签名（可消除「已损坏」误报；非 Developer ID 分发级签名，首次打开仍需右键 → 打开；免右键需开发者账号公证，暂缓）
          - Windows 主端：YuDuan-main_${TAG}_windows.exe（免安装，直接运行）
          - Windows 主端（安装器）：YuDuan-main_${TAG}_windows_setup.exe（NSIS；企业批量静默分发 `setup.exe /S`，/D=x:\dir 自定义目录须置于参数末且不带引号）
          - Linux 主端：YuDuan-main_${TAG}_linux_amd64（裸二进制，chmod +x 后直接运行；需系统预装 libwebkit2gtk-4.1 / libayatana-appindicator3 / librsvg2；桌面 .desktop 集成与依赖打包 .deb/AppImage 待后续版本补齐）
          - Windows 副端：YuDuan-agent_${TAG}_windows.exe（双击即清旧配置+装服务+启动）；macOS 副端：YuDuan-agent_${TAG}_macos_arm64 / _macos_x64（MSVC/Rust 原生构建；局域网内启动后 UDP 自动发现中枢并注册，无需配置；客户自建公网部署须显式 YUDUAN_HUB，见包内 README-deploy.md）
          - Linux 副端：YuDuan-agent_${TAG}_linux_amd64.tar.gz / YuDuan-agent_${TAG}_linux_arm64.tar.gz（systemd 部署，tar 解包 → sudo ./install.sh；std-only 单文件，arm64 为原生 ARM runner 构建）

          ## 中枢（Linux / Windows / macOS）
          - YuDuan-hub_${TAG}_linux_amd64|arm64.tar.gz：systemd 部署，tar 解包 → sudo ./install.sh
          - YuDuan-hub_${TAG}_windows_amd64.zip：run-hub.cmd 前台运行 或 register-task.ps1 开机自启
          - YuDuan-hub-server-db_${TAG}_windows_amd64.zip：**服务器整包（内置 PostgreSQL 16.9-1 数据库附件）**——离线/内网服务器首选，解压后直接跑 deploy.bat，PG 自动就绪免公网下载（约 320MB）
          - YuDuan-hub_${TAG}_macos_arm64|amd64.tar.gz：launchd 部署，sudo ./install-macos.sh
          - 均内含配置模板与 README-deploy.md（防火墙端口 / 生产检查清单 / 升级步骤 / 客户自建公网部署）；Linux/macOS 包另含 init-ca.sh + prepare-public-cert.sh + yuduan-acme（P1 公网证书 ACME 自动签发），Windows 包另含 prepare-public-cert.ps1 + yuduan-acme.exe

          对应源码版本见私有仓 g-star1024/YuDuan 标签 $TAG。"; then
            echo "::error::gh release create 失败，尝试向既有 release 追加资产"
            gh release view "$TAG" || gh release create "$TAG" --title "御端 $TAG" --notes "御端发布 $TAG"
            gh release upload "$TAG" release-files/* --clobber
          fi
          gh release view "$TAG" --json name,assets -q '.name + " assets=" + (.assets | length | tostring)'
