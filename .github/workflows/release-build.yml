# 御端发布打包（发布仓承载 CI）
#
# 本 workflow 运行在公开仓 g-star1024/YuDuan-release（公开仓 Actions 免费），
# 从私有源码仓 g-star1024/YuDuan 拉取对应标签源码构建，产物发布到本仓库 Release。
#
# 触发：
#   - 推送 v* 标签到本仓库 → 构建私有仓同名标签源码
#   - 手动 workflow_dispatch → 可指定 source_ref（tag/分支/commit）
#
# 前置 Secret：YUDUAN_RELEASE_TOKEN —— 需具备 g-star1024/YuDuan（私有仓）
#   contents:read 权限的 PAT（classic repo 作用域或 fine-grained 单仓只读授权）。
#   Release 发布使用本仓默认 GITHUB_TOKEN，无需额外授权。
#
# 产物（发布到本仓库 Release）：
#   - macOS：主端 Tauri .dmg（未签名，首开右键打开）
#   - Windows：主端 yuduan-main.exe + 副端 yuduan-agent.exe（MSVC 原生构建，
#     遵守发布纪律：不使用 macOS 交叉编译产物）
#   - 中枢：Linux amd64/arm64 / Windows / macOS 全平台部署包

name: release-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "私有仓源码 ref（tag / 分支 / commit），留空默认 main"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/go.mod  # 纯标准库零依赖，无需 go.sum/缓存

      - name: Test 中枢
        working-directory: dev
        run: go test ./... -count=1

      - name: Build 中枢（linux/windows/macos 全平台）
        working-directory: dev
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist-out

          # —— Linux（systemd）——
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/hub_linux_$arch" ./cmd/hub
            dir="hub-pkg/yuduan-hub_${TAG}_linux_${arch}"
            mkdir -p "$dir"
            cp "/tmp/hub_linux_$arch" "$dir/yuduan-hub"
            cp deploy/hub/env.example deploy/hub/README-deploy.md \
               deploy/hub/install.sh deploy/hub/yuduan-hub.service "$dir/"
            chmod +x "$dir/install.sh" "$dir/yuduan-hub"
            tar -czf "dist-out/YuDuan-hub_${TAG}_linux_${arch}.tar.gz" -C hub-pkg "yuduan-hub_${TAG}_linux_${arch}"
          done

          # —— Windows（控制台/计划任务）——
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w" -o "/tmp/hub_windows/yuduan-hub.exe" ./cmd/hub
          wdir="hub-pkg/yuduan-hub_${TAG}_windows_amd64"
          mkdir -p "$wdir"
          cp /tmp/hub_windows/yuduan-hub.exe "$wdir/"
          cp deploy/hub/env.example deploy/hub/README-deploy.md \
             deploy/hub/deploy.bat deploy/hub/run-hub.cmd deploy/hub/register-task.ps1 "$wdir/"
          (cd hub-pkg && zip -rq "../dist-out/YuDuan-hub_${TAG}_windows_amd64.zip" "yuduan-hub_${TAG}_windows_amd64")

          # —— macOS（launchd）——
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" -o "/tmp/hub_darwin_$arch" ./cmd/hub
            dir="hub-pkg/yuduan-hub_${TAG}_macos_${arch}"
            mkdir -p "$dir"
            cp "/tmp/hub_darwin_$arch" "$dir/yuduan-hub"
            cp deploy/hub/env.example deploy/hub/README-deploy.md deploy/hub/install-macos.sh "$dir/"
            chmod +x "$dir/install-macos.sh" "$dir/yuduan-hub"
            tar -czf "dist-out/YuDuan-hub_${TAG}_macos_${arch}.tar.gz" -C hub-pkg "yuduan-hub_${TAG}_macos_${arch}"
          done
          ls -la dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: hub-all
          path: dev/dist-out/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin  # macos-latest 为 arm64 runner，Intel 版交叉构建

      - name: Build 主端（macOS dmg，双架构）
        working-directory: main
        run: |
          npm ci
          npx tauri build
          npx tauri build --target x86_64-apple-darwin

      - name: Build 副端 agent（macOS 双架构）
        working-directory: rust/agent
        run: |
          mkdir -p dist-out
          rustc -O src/main.rs -o dist-out/yuduan-agent-arm64
          rustc -O --target x86_64-apple-darwin src/main.rs -o dist-out/yuduan-agent-x64
          ls -la dist-out/

      - name: Collect artifacts
        run: |
          mkdir -p dist-out
          cp main/src-tauri/target/release/bundle/dmg/*.dmg dist-out/
          cp main/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist-out/
          cp rust/agent/dist-out/yuduan-agent-arm64 rust/agent/dist-out/yuduan-agent-x64 dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-client
          path: dist-out/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build 副端 agent（MSVC 原生；exe 自安装：双击即清旧配置+装服务+启动）
        working-directory: rust/agent
        shell: pwsh
        run: rustc -O src/main.rs -o yuduan-agent.exe

      - name: Build 主端（Windows exe，免安装器取裸 exe）
        working-directory: main
        shell: pwsh
        run: |
          npm ci 2>&1 | tee build-main.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npx tauri build --no-bundle 2>&1 | tee -a build-main.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "==================== error 行（最多 8 条）===================="
            Select-String -Path build-main.log -Pattern "error(\[|:)" | Select-Object -Last 8 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            Write-Output "==================== 日志尾部 3 行 ===================="
            Get-Content build-main.log -Tail 3 | ForEach-Object { Write-Output "::error::$($_.Trim())" }
            exit 1
          }

      - name: 失败时推日志到 ci-logs-win 分支
        if: failure()
        working-directory: main
        shell: pwsh
        run: |
          git config user.email "ci@yuduan.local"
          git config user.name "ci-logger"
          git checkout --orphan ci-logs-win
          git rm -rf --cached . 2>$null
          git add build-main.log
          git commit -m "windows main build log"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::commit failed"; exit 1 }
          git push -f "https://x-access-token:${env:YUDUAN_RELEASE_TOKEN}@github.com/g-star1024/YuDuan-release.git" ci-logs-win
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::push ci-logs-win failed"; exit 1 }
        env:
          YUDUAN_RELEASE_TOKEN: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            rust/agent/yuduan-agent.exe
            main/src-tauri/target/release/yuduan-main.exe
          if-no-files-found: error

  build-linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g-star1024/YuDuan
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.YUDUAN_RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build 副端 agent（Linux 双架构，std-only 单文件）
        working-directory: rust/agent
        run: |
          mkdir -p dist-out
          rustc -O src/main.rs -o dist-out/yuduan-agent-linux-amd64
          rustc -O --target aarch64-unknown-linux-gnu -C linker=aarch64-linux-gnu-gcc src/main.rs -o dist-out/yuduan-agent-linux-arm64
          ls -la dist-out/

      - name: 打包 Linux 副端部署包（systemd + install.sh）
        working-directory: rust/agent
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist-out/pkg
          for arch in amd64 arm64; do
            dir="dist-out/pkg/yuduan-agent_${TAG}_linux_${arch}"
            mkdir -p "$dir/systemd"
            cp "dist-out/yuduan-agent-linux-${arch}" "$dir/yuduan-agent"
            cp deploy/install-linux.sh "$dir/install.sh"
            cp deploy/systemd/yuduan-agent.service "$dir/systemd/yuduan-agent.service"
            cp README.md "$dir/README.md"
            chmod +x "$dir/install.sh" "$dir/yuduan-agent"
            tar -czf "dist-out/YuDuan-agent_${TAG}_linux_${arch}.tar.gz" -C "dist-out/pkg" "yuduan-agent_${TAG}_linux_${arch}"
          done
          ls -la dist-out/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: rust/agent/dist-out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows, build-hub, build-linux-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-out

      - name: 按标签重命名产物
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ inputs.source_ref || 'snapshot' }}"; fi
          mkdir -p release-files
          dmg_arm=$(find dist-out -name "*aarch64*.dmg" | head -1)
          dmg_x64=$(find dist-out -name "*x64*.dmg" | head -1)
          mainexe=$(find dist-out/windows-client -name "yuduan-main.exe" | head -1)
          agentexe=$(find dist-out/windows-client -name "yuduan-agent.exe" | head -1)
          echo "dmg_arm=$dmg_arm"; echo "dmg_x64=$dmg_x64"; echo "main=$mainexe"; echo "agent=$agentexe"
          cp "$dmg_arm" "release-files/YuDuan-main_${TAG}_macos_arm64.dmg"
          cp "$dmg_x64" "release-files/YuDuan-main_${TAG}_macos_x64.dmg"
          cp "$mainexe" "release-files/YuDuan-main_${TAG}_windows.exe"
          cp "$agentexe" "release-files/YuDuan-agent_${TAG}_windows.exe"
          cp dist-out/macos-client/yuduan-agent-arm64 "release-files/YuDuan-agent_${TAG}_macos_arm64"
          cp dist-out/macos-client/yuduan-agent-x64 "release-files/YuDuan-agent_${TAG}_macos_x64"
          cp dist-out/linux-agent/*.tar.gz "release-files/"
          cp dist-out/hub-all/*.tar.gz dist-out/hub-all/*.zip release-files/
          ls -la release-files/

      - name: 发布 Release 到本仓库
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: g-star1024/YuDuan-release  # publish 无 checkout，必须显式指定仓库
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ inputs.source_ref || 'snapshot' }}"; fi
          if ! gh release create "$TAG" release-files/* \
            --title "御端 $TAG" \
            --notes "御端发布 $TAG

          ## 客户端
          - macOS 主端：YuDuan-main_${TAG}_macos_arm64.dmg（Apple Silicon）/ _macos_x64.dmg（Intel）——未签名，首次打开请右键 → 打开
          - Windows 主端：YuDuan-main_${TAG}_windows.exe（免安装，直接运行）
          - Windows 副端：一键包 YuDuan-agent_${TAG}_windows_onekey.zip（解压后双击 deploy-agent.bat，自动清旧配置+装服务）；裸 exe YuDuan-agent_${TAG}_windows.exe；macOS 副端：YuDuan-agent_${TAG}_macos_arm64 / _macos_x64（MSVC/Rust 原生构建；启动后 UDP 自动发现中枢并注册，无需配置）
          - Linux 副端：YuDuan-agent_${TAG}_linux_amd64|arm64.tar.gz（systemd 部署，tar 解包 → sudo ./install.sh；std-only 单文件）

          ## 中枢（Linux / Windows / macOS）
          - YuDuan-hub_${TAG}_linux_amd64|arm64.tar.gz：systemd 部署，tar 解包 → sudo ./install.sh
          - YuDuan-hub_${TAG}_windows_amd64.zip：run-hub.cmd 前台运行 或 register-task.ps1 开机自启
          - YuDuan-hub_${TAG}_macos_arm64|amd64.tar.gz：launchd 部署，sudo ./install-macos.sh
          - 均内含配置模板与 README-deploy.md（防火墙端口 / 生产检查清单 / 升级步骤）

          对应源码版本见私有仓 g-star1024/YuDuan 标签 $TAG。"; then
            echo "::error::gh release create 失败，尝试向既有 release 追加资产"
            gh release view "$TAG" || gh release create "$TAG" --title "御端 $TAG" --notes "御端发布 $TAG"
            gh release upload "$TAG" release-files/* --clobber
          fi
          gh release view "$TAG" --json name,assets -q '.name + " assets=" + (.assets | length | tostring)'
